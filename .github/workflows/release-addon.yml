# Build an installable StockPiler zip (not full repo source) and publish it.
# - Push to main, or a manual run of main → moving "latest" prerelease (one zip),
#   a vX.Y.Z release, and an upload to the Return of Reckoning addon site when that version is new
# - A manual run from another branch only packs the zip
# - Tag v* → versioned GitHub Release
# Version tags older than the newest 10 are deleted.
name: Release addon zip

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          section="${RUNNER_TEMP:-/tmp}/stockpiler-changelog.md"
          notes="${RUNNER_TEMP:-/tmp}/stockpiler-release-notes.md"
          version=$(python3 scripts/changelog-section.py \
            --section-out "$section" \
            --notes-out "$notes")
          {
            echo "version=${version}"
            echo "changelog_path=${section}"
            echo "release_notes_path=${notes}"
          } >> "$GITHUB_OUTPUT"

      - name: Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          # WAR wstring literals (L"...") are not valid Lua 5.1. Check a rewritten copy.
          tmp=$(mktemp -d)
          find Source -name '*.lua' -print0 | while IFS= read -r -d '' f; do
            rel=${f#Source/}
            mkdir -p "$tmp/$(dirname "$rel")"
            sed -E 's/L"([^"]*)"/"\1"/g' "$f" > "$tmp/$rel"
            luac5.1 -p "$tmp/$rel"
          done

      - name: Pack addon zip
        id: pack
        shell: pwsh
        run: ./scripts/pack.ps1 -OutDir dist

      - name: Verify addon zip layout
        shell: bash
        env:
          ZIP: ${{ steps.pack.outputs.zip_path }}
          VERSION: ${{ steps.pack.outputs.version }}
          EXPECTED_VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Packed version ${VERSION} does not match StockPiler.mod ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          python3 scripts/verify-addon-zip.py "$ZIP"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPiler-addon
          path: dist/StockPiler-*.zip
          if-no-files-found: error

      - name: Upload new release to the addon site
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          ROR_TOKEN: ${{ secrets.ROR_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip_path }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog_path }}
        run: bash scripts/publish-ror.sh

      - name: Publish latest zip and keep 10 version tags
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip_path }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes_path }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          version_notes=$(cat "$RELEASE_NOTES")
          notes=$(printf '%s\n' \
            "Installable addon zip (not the full git tree)." \
            "" \
            "Unzip into \`Interface/AddOns/\` so you get \`Interface/AddOns/StockPiler/\`." \
            "" \
            "- Version: ${VERSION}" \
            "- Commit: ${GITHUB_SHA}")
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "StockPiler ${VERSION}" \
              --latest \
              --notes "$version_notes"
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --prerelease \
            --notes "$notes"
          gh release list --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v"))] | sort_by(.publishedAt) | reverse | .[10:] | .[].tagName' \
            | while IFS= read -r old; do
                [ -n "$old" ] || continue
                gh release delete "$old" --yes --cleanup-tag
              done

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StockPiler ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.release_notes_path }}
          prerelease: false
          make_latest: true
          files: dist/StockPiler-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
