# Build an installable StockPiler zip (not full repo source) and publish it.
# - Push to main, or a manual run of main → a vX.Y.Z release,
#   and an upload to the Return of Reckoning addon site when that version is new
# - A manual run from another branch only packs the zip
# - Tag v* → versioned GitHub Release
# Version tags older than the newest 10 are deleted.
# A leftover "latest" prerelease and tag are removed on the next main publish.
name: Release addon zip

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          section="${RUNNER_TEMP:-/tmp}/stockpiler-changelog.md"
          notes="${RUNNER_TEMP:-/tmp}/stockpiler-release-notes.md"
          version=$(python3 scripts/changelog-section.py \
            --section-out "$section" \
            --notes-out "$notes")
          {
            echo "version=${version}"
            echo "changelog_path=${section}"
            echo "release_notes_path=${notes}"
          } >> "$GITHUB_OUTPUT"

      - name: Lua syntax, tests, and version consistency
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          boot=$(sed -n 's/^StockPiler.Version = L"\([^"]*\)".*/\1/p' Source/Bootstrap.lua)
          if [[ "$boot" != "$VERSION" ]]; then
            echo "Source/Bootstrap.lua version ${boot} does not match StockPiler.mod / CHANGELOG ${VERSION}" >&2
            exit 1
          fi
          if [[ -f Source/Constants.lua ]]; then
            const=$(sed -n 's/^StockPiler.Version = L"\([^"]*\)".*/\1/p' Source/Constants.lua | head -n 1)
            if [[ -z "$const" ]]; then
              const=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' Source/Constants.lua | head -n 1)
            fi
            if [[ -n "$const" && "$const" != "$VERSION" ]]; then
              echo "Source/Constants.lua version ${const} does not match ${VERSION}" >&2
              exit 1
            fi
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match addon version v${VERSION}" >&2
            exit 1
          fi
          # WAR wstring literals (L"...") are not valid Lua 5.1. Check a rewritten copy.
          tmp=$(mktemp -d)
          find Source -name '*.lua' -print0 | while IFS= read -r -d '' f; do
            rel=${f#Source/}
            mkdir -p "$tmp/$(dirname "$rel")"
            sed -E 's/L"([^"]*)"/"\1"/g' "$f" > "$tmp/$rel"
            luac5.1 -p "$tmp/$rel"
          done
          # tests/*.lua includes tests/locale_tokens.lua ({token} gsub regression),
          # tests/skillup_apo_ready.lua, tests/refine_vendor_block.lua,
          # tests/upgrade_cult_floor.lua, tests/release_113_surgical.lua,
          # and tests/release_114_bundle.lua.
          for t in tests/*.lua; do
            lua5.1 "$t"
          done

      - name: Pack addon zip
        id: pack
        shell: pwsh
        run: ./scripts/pack.ps1 -OutDir dist

      - name: Verify addon zip layout
        shell: bash
        env:
          ZIP: ${{ steps.pack.outputs.zip_path }}
          VERSION: ${{ steps.pack.outputs.version }}
          EXPECTED_VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Packed version ${VERSION} does not match StockPiler.mod ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          python3 scripts/verify-addon-zip.py "$ZIP"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPiler-addon
          path: dist/StockPiler-*.zip
          if-no-files-found: error

      - name: Upload new release to the addon site
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          ROR_TOKEN: ${{ secrets.ROR_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip_path }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog_path }}
        run: bash scripts/publish-ror.sh

      - name: Publish versioned release and keep 10 version tags
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip_path }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes_path }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          version_notes=$(cat "$RELEASE_NOTES")
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "StockPiler ${VERSION}" \
              --latest \
              --notes "$version_notes"
          fi
          # Drop the old moving prerelease. --cleanup-tag removes its tag when
          # the release still exists; the push covers a tag left behind alone.
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release list --limit 100 --json tagName,publishedAt,isDraft,isPrerelease \
            --jq '[.[] | select(.tagName | startswith("v")) | select(.isDraft == false and .isPrerelease == false)] | sort_by(.publishedAt) | reverse | .[10:] | .[].tagName' \
            | while IFS= read -r old; do
                [ -n "$old" ] || continue
                gh release delete "$old" --yes --cleanup-tag
              done

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.changelog.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip_path }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.release_notes_path }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match addon version ${tag}" >&2
            exit 1
          fi
          version_notes=$(cat "$RELEASE_NOTES")
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "StockPiler ${VERSION}" \
              --latest \
              --notes "$version_notes"
          else
            echo "Release ${tag} already exists; leaving it in place"
          fi
